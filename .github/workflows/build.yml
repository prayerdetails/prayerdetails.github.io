name: Build Site

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note for this run
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayerdetails-site
          path: |
            index.html
            style.css
            sitemap.xml
            area
            masjid
          if-no-files-found: error
